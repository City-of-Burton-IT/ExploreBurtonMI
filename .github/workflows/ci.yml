name: CI

# Runs the full check suite on every pull request (and manual dispatch).
# deploy.yml re-runs the web checks on push to main before publishing.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check + tsc)
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # tools/requirements.txt is not installed wholesale: overturemaps pulls
      # heavy binary readers and is only needed by extract_overture.py, which has
      # no tests. Install the pipeline deps plus the two light tools deps that
      # tested scripts import.
      - name: Install test deps
        run: pip install -r pipeline/requirements.txt 'openpyxl>=3.1' 'pyshp>=2.3'

      - name: Run pipeline + tools tests
        run: pytest pipeline/test tools -q

  pin-editor:
    name: pin-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pin-editor deps
        run: pip install -r apps/pin-editor/requirements.txt

      - name: Run pin-editor tests
        run: pytest apps/pin-editor/test -q
