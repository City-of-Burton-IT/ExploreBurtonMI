name: Android debug APK

# Manual-only: build an installable DEBUG APK for sideload testing on a phone
# (this box has no Android SDK; GitHub's Ubuntu runners do). Run it from the
# Actions tab, then download the artifact and install it on an Android device.
# This does NOT publish anything -- it's a debug-signed build for testing.
on:
  workflow_dispatch:

concurrency:
  group: android-debug
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8's android library compiles to Java 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync to the Android project
        run: npx cap sync android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Sign every build with the SAME keystore (from a secret) at the exact path the
      # build.gradle debug signingConfig reads -- otherwise the signature changes each
      # build and Android refuses the in-place update (forcing an uninstall/reinstall).
      - name: Restore the shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > android/debug-shared.keystore

      # Firebase/FCM client config (#64) -- gitignored; injected from a secret so
      # debug sideload builds can test push too. Absent secret -> push stays inert.
      - name: Restore the Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON_B64 not set -- building without push (inert)"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show signing certificate (should be identical every build)
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256 digest" | head -1

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: explore-burton-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
