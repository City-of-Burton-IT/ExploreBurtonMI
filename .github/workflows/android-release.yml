name: Android release (Play internal)

# Manual-only: build a RELEASE-signed Android App Bundle (.aab) and upload it to the
# Google Play "internal testing" track. Play only accepts .aab (not .apk) for uploads,
# and rejects debug-signed builds -- so this is separate from android-debug.yml.
#
# Signing: we sign with our UPLOAD key (decoded from a secret); Google re-signs the
# delivered app with the app signing key under Play App Signing. versionCode is the
# GitHub run number so every upload is unique and increasing (Play rejects duplicates).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64     - base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD       - keystore (store) password
#   ANDROID_KEY_ALIAS               - key alias (explore-burton-upload)
#   ANDROID_KEY_PASSWORD            - key password (same as store password here)
# Keyless Play upload via Workload Identity Federation (NO downloadable key):
#   GCP_PROJECT_ID                  - the Google Cloud project id
#   GCP_WORKLOAD_IDENTITY_PROVIDER  - projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             - the Play-publisher service account email (impersonated; no key)
# See PLAY_RELEASE.md step 3 for the one-time GCP setup (gcloud commands + org-policy notes).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'User-facing version name (e.g. 1.0.1)'
        required: true
        default: '1.0'
      status:
        description: 'Play release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed   # roll out to all internal testers immediately
          - draft       # create the release in the console but do not release it

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # REQUIRED for keyless auth: lets the job mint a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8's android library compiles to Java 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync to the Android project
        run: npx cap sync android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Restore the upload keystore
        run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}" | base64 -d > android/upload-keystore.jks

      - name: Build release AAB
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.versionName }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Show signing certificate
        run: |
          BUNDLETOOL_AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -p "$BUNDLETOOL_AAB" META-INF/*.RSA > /dev/null 2>&1 || true
          echo "Built signed bundle: $BUNDLETOOL_AAB"
          ls -la android/app/build/outputs/bundle/release/

      - name: Upload AAB as a build artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: explore-burton-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # --- Keyless upload (no JSON service-account key) ---------------------------
      # Authenticate to Google Cloud via Workload Identity Federation: GitHub's OIDC
      # token is exchanged for short-lived credentials that impersonate the Play
      # publisher service account. Requesting an androidpublisher-scoped access token
      # here VERIFIES the whole WIF -> impersonation -> scope chain BEFORE we attempt
      # the upload, so a misconfiguration fails loudly at this step, not mid-upload.
      - name: Authenticate to Google Cloud (keyless, WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # Gradle Play Publisher reads Application Default Credentials (the file the auth
      # step just wrote, exported as GOOGLE_APPLICATION_CREDENTIALS) -- no key. The AAB
      # was already built by bundleRelease above; this reuses it and uploads.
      # NOTE: the FIRST ever upload will fail until one release exists in the console
      # (Play App Signing enrollment) -- that's expected; the AAB artifact above still
      # ships. See PLAY_RELEASE.md step 4.
      - name: Upload to Play (internal testing track) -- keyless
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.versionName }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew publishReleaseBundle \
            --track internal \
            --release-status ${{ inputs.status }} \
            --no-daemon --stacktrace
