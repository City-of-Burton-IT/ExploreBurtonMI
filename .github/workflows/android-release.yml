name: Android release (Play internal)

# Manual-only: build a RELEASE-signed Android App Bundle (.aab) and upload it to the
# Google Play "internal testing" track. Play only accepts .aab (not .apk) for uploads,
# and rejects debug-signed builds -- so this is separate from android-debug.yml.
#
# Signing: we sign with our UPLOAD key (decoded from a secret); Google re-signs the
# delivered app with the app signing key under Play App Signing. versionCode is the
# GitHub run number so every upload is unique and increasing (Play rejects duplicates).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64     - base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD       - keystore (store) password
#   ANDROID_KEY_ALIAS               - key alias (explore-burton-upload)
#   ANDROID_KEY_PASSWORD            - key password (same as store password here)
# Keyless Play upload via Workload Identity Federation (NO downloadable key):
#   GCP_PROJECT_ID                  - the Google Cloud project id
#   GCP_WORKLOAD_IDENTITY_PROVIDER  - projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             - the Play-publisher service account email (impersonated; no key)
# See PLAY_RELEASE.md step 3 for the one-time GCP setup (gcloud commands + org-policy notes).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'User-facing version name (e.g. 1.0.1)'
        required: true
        default: '1.0'
      status:
        description: 'Play release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed   # roll out to all internal testers immediately
          - draft       # create the release in the console but do not release it
      releaseNotes:
        description: "What's new in this version (one line; shown to internal testers). Leave blank for none."
        required: false
        default: ''

concurrency:
  group: android-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # REQUIRED for keyless auth: lets the job mint a GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8's android library compiles to Java 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync to the Android project
        run: npx cap sync android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Restore the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks

      # Firebase/FCM client config (#64). Gitignored (carries a restricted client
      # API key); injected here from a secret. If the secret is unset the build
      # still succeeds -- the google-services Gradle plugin is skipped and push
      # stays inert (push.ts no-ops).
      - name: Restore the Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON_B64 not set -- building without push (inert)"
          fi

      - name: Build release AAB
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.versionName }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Show signing certificate
        run: |
          BUNDLETOOL_AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -p "$BUNDLETOOL_AAB" META-INF/*.RSA > /dev/null 2>&1 || true
          echo "Built signed bundle: $BUNDLETOOL_AAB"
          ls -la android/app/build/outputs/bundle/release/

      - name: Upload AAB as a build artifact (backup)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: explore-burton-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # --- Keyless upload (no JSON service-account key) ---------------------------
      # Authenticate to Google Cloud via Workload Identity Federation: GitHub's OIDC
      # token is exchanged for short-lived credentials that impersonate the Play
      # publisher service account. Requesting an androidpublisher-scoped access token
      # here VERIFIES the whole WIF -> impersonation -> scope chain BEFORE we attempt
      # the upload, so a misconfiguration fails loudly at this step, not mid-upload.
      - name: Authenticate to Google Cloud (keyless, WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # Upload via the Play Developer REST API using the short-lived access token the
      # auth step minted (keyless -- no JSON key, no Gradle plugin). Flow: open an
      # edit, upload the .aab, assign it to the internal track, commit.
      # NOTE: the FIRST ever upload fails until one release exists in the console
      # (Play App Signing enrollment) -- that's expected; the AAB artifact above still
      # ships, so you can do that first release by hand. See PLAY_RELEASE.md step 4.
      - name: Upload to Play (internal testing track) -- keyless
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          STATUS: ${{ inputs.status }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -euo pipefail
          PKG=gov.burtonmi.explore
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          API=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG
          UPLOAD=https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PKG
          AUTH="Authorization: Bearer $ACCESS_TOKEN"

          die() { echo "::error::$1"; echo "API response: $2"; exit 1; }

          echo "Opening an edit..."
          resp=$(curl -sS -X POST -H "$AUTH" "$API/edits")
          EDIT=$(echo "$resp" | jq -r '.id // empty')
          [ -n "$EDIT" ] || die "Could not open an edit (is the app created and the service account granted access?)" "$resp"

          echo "Uploading $AAB ..."
          resp=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                 --data-binary @"$AAB" "$UPLOAD/edits/$EDIT/bundles?uploadType=media")
          VC=$(echo "$resp" | jq -r '.versionCode // empty')
          [ -n "$VC" ] || die "Bundle upload failed (first ever upload must be done by hand to enroll Play App Signing)" "$resp"
          echo "Uploaded versionCode $VC"

          echo "Assigning versionCode $VC to the internal track (status: $STATUS)..."
          # Build the track body with jq so release-notes text is safely JSON-escaped
          # (handles quotes/spaces). Play caps notes at 500 chars/language; omit the
          # field entirely when blank so we don't publish empty notes. language must
          # be one of the app's listing languages (en-US is the default here).
          if [ -n "${RELEASE_NOTES:-}" ]; then
            TRACK_BODY=$(jq -n --arg vc "$VC" --arg status "$STATUS" --arg notes "$RELEASE_NOTES" \
              '{track:"internal",releases:[{status:$status,versionCodes:[$vc],releaseNotes:[{language:"en-US",text:$notes}]}]}')
            echo "Release notes (en-US): $RELEASE_NOTES"
          else
            TRACK_BODY=$(jq -n --arg vc "$VC" --arg status "$STATUS" \
              '{track:"internal",releases:[{status:$status,versionCodes:[$vc]}]}')
            echo "No release notes supplied -- the release will carry none."
          fi
          resp=$(curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
                 -d "$TRACK_BODY" "$API/edits/$EDIT/tracks/internal")
          echo "$resp" | jq -e '.track == "internal"' >/dev/null || die "Track assignment failed" "$resp"

          echo "Committing the edit..."
          resp=$(curl -sS -X POST -H "$AUTH" "$API/edits/$EDIT:commit")
          echo "$resp" | jq -e '.id' >/dev/null || die "Commit failed" "$resp"
          echo "Uploaded to the internal track (versionCode $VC, status $STATUS)."
