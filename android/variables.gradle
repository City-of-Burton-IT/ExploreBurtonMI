ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // Target 35 (Android 15) -- required by Google Play for new uploads. Android 15
    // forces edge-to-edge by default (content draws under the status + nav bars); we
    // OPT OUT via android:windowOptOutEdgeToEdgeEnforcement in res/values/styles.xml so
    // the system keeps insetting the WebView exactly as before. The opt-out is valid
    // until we target 36 (Android 16) -- proper edge-to-edge inset handling is the
    // follow-up to do before then.
    targetSdkVersion = 35
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}